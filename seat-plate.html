<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>座位号码牌生成器 · Seat Plate Generator</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f4f6fb; padding:24px 16px; }
  .tool { max-width:560px; margin:0 auto; background:#fff; border-radius:14px; box-shadow:0 4px 20px rgba(30,60,120,.10); padding:22px; }
  h1 { font-size:18px; color:#1e3a8a; }
  p.sub { font-size:13px; color:#6b7280; margin-top:6px; line-height:1.7; }
  label { display:block; margin:14px 0 6px; font-size:14px; font-weight:600; color:#1f2937; }
  input { width:100%; padding:10px 12px; font-size:15px; border:1.5px solid #d1d5db; border-radius:10px; }
  input:focus { border-color:#2563eb; outline:none; }
  .row { display:flex; gap:10px; margin-top:16px; }
  button { flex:1; padding:12px; font-size:15px; font-weight:600; color:#fff; background:#2563eb; border:none; border-radius:10px; cursor:pointer; }
  button.gray { background:#6b7280; }
  .plates { margin-top:22px; display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  .plate { background:#fff; border:2px dashed #cbd5e1; border-radius:12px; padding:14px 10px; text-align:center; page-break-inside:avoid; }
  .plate img { width:70%; max-width:170px; aspect-ratio:1/1; }
  .plate .seat { font-size:26px; font-weight:800; color:#1e3a8a; letter-spacing:2px; margin-top:2px; }
  .plate .en { font-size:12px; color:#6b7280; margin-top:2px; }
  @media print {
    body { background:#fff; padding:0; }
    .tool, .no-print { display:none; }
    .plates { display:grid; grid-template-columns:repeat(3,1fr); gap:10mm; padding:10mm; }
    .plate { border:1px solid #e2e8f0; }
  }
</style>
</head>
<body>
  <div class="tool">
    <h1>座位号码牌生成器 Seat Plate Generator</h1>
    <p class="sub">输入座位号 → 生成专属二维码号码牌 → 浏览器打印(check capture: Ctrl+P / 菜单-打印)。
       学生扫某张牌, 签到时座位号将<b>自动识别、无需手填</b>。<br>
       Enter seat codes to generate desk plates. Students scan a plate and the seat is auto-detected — no typing.</p>

    <label for="codes">座位号 (多个用逗号或换行分隔) Seats — separate by comma/new line</label>
    <input id="codes" placeholder="A12  或  A01,A02,A03">

    <div class="row">
      <button onclick="make()">生成 Plates</button>
      <button class="gray no-print" onclick="window.print()">打印 Print</button>
    </div>
  </div>

  <div class="plates" id="plates"></div>

<script>
function make() {
  const codes = document.getElementById("codes").value
    .split(/[,，\n]/).map(s => s.trim()).filter(Boolean);
  if (!codes.length) { alert("请先输入座位号 / Please enter seat codes"); return; }
  const base = location.href.replace(/[^\/]*$/, "");
  document.getElementById("plates").innerHTML = codes.map(c =>
    `<div class="plate">
       <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=16&data=${encodeURIComponent(base + "?seat=" + encodeURIComponent(c))}" alt="QR ${c}">
       <div class="seat">${c}</div>
       <div class="en">座位 Seat · 扫码签到 Scan to check in</div>
       <div class="en" style="color:#2563eb">扫码签入 · 离开签出 · 暂离≤30分钟<br>Check in · Check out · Away ≤30 min</div>
     </div>`).join("");
}
</script>
</body>
</html>
